# The root is a package as well as the workspace, with no code of its own
# (`src/lib.rs` is a doc comment). release-please's `rust` strategy refuses a
# virtual manifest, and versioning every member in lockstep is what keeps
# `Cargo.lock` in step with the released version.
[package]
name = "immich-sync-workspace"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/immich-client",
    "crates/mock-immich",
    "crates/sync-core",
]
# The root package above has no code. Without this, a bare `cargo build`
# builds only it, and `cargo build --bin immich-sync` no longer finds the bin.
# `--workspace` still covers every member.
default-members = [
    "crates/app",
    "crates/immich-client",
    "crates/mock-immich",
    "crates/sync-core",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
# Pin the shell stack exactly. gpui-kit imposes an exact `gpui-pre`; a caret
# range would let a patch release move it (ADR 0001). 0.8.1 is the release the
# component tickets build on: its fixed focus, keyboard and accessibility
# behaviour is what they need, and it pins gpui-pre 0.3.10. gpui-tray 0.1.4
# still resolves onto that one snapshot through its `gpui-pre ^0.3.4` range, so
# the graph holds a single `gpui-pre` and the tray needs no bump.
anyhow = "1"
async-channel = "=2.5.0"
gpui-kit = "=0.8.1"
# Only the `gpui-kit` backend. The three gpui-tray backends are mutually
# exclusive and `compile_error!` when more than one is enabled, so never build
# the workspace with `--all-features`.
gpui-tray = { version = "=0.1.4", default-features = false, features = ["gpui-kit", "menu-state"] }
interprocess = "=2.4.5"

[profile.dev.package."*"]
# The dependency tree (GPUI and friends, ~850 crates) is recompiled often and its
# DWARF dominates compile and link time. Third-party debug info is not needed;
# workspace crates keep theirs so backtraces stay useful.
debug = false
