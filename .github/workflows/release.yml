# yamllint disable rule:line-length
# Pinned action SHAs cannot be wrapped without breaking the reference, and the
# packager and gh invocations read worse split than long.
name: release

# Releases are built from a version tag. A tag pushed by hand triggers this
# workflow; release-please cannot, because a tag pushed with the Actions token
# starts no workflow, so `release-please.yml` calls this as a reusable workflow
# instead. `workflow_dispatch` builds the same packages without publishing,
# which is how an unsigned candidate is checked before a tag exists.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (empty: build only)"
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# No dependency cache here on purpose: a poisoned Actions cache could change
# the published binaries while the provenance attestation still names this
# workflow. Releases are rare; a cold build is the price. The per-push ci
# workflow keeps its caches.

permissions:
  contents: read

jobs:
  # Fails a tag that does not name the version in the manifest, before two
  # release builds are paid for. A dispatch without a tag input skips the step
  # while the job still succeeds (a skipped job would skip its dependents too).
  version:
    name: Version matches the tag
    runs-on: ubuntu-24.04
    env:
      # `github.ref_name` on a tag push, the input when called or dispatched.
      # `github.ref_type` is 'branch' in the other two cases, so the steps
      # below test this instead of it.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Nothing here pushes over git; the token must not land in .git.
          persist-credentials: false
      - name: Compare the tag with the package version
        if: inputs.tag != '' || github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('crates/app/Cargo.toml','rb'))['package']['version'])")
          echo "manifest version: $version, tag: $RELEASE_TAG"
          test "v$version" = "$RELEASE_TAG"

  linux:
    name: Linux packages (deb, AppImage)
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only used by the attestation step below, which stays skipped while
      # the repository variable is unset.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan1 \
            libssl-dev libzstd-dev libdbus-1-dev
          # linuxdeploy calls patchelf. It is not on the runner image and the
          # failure is an unattributed "subprocess failed (exit code 127)".
          sudo apt-get install -y patchelf
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Build the client (release)
        run: cargo build --release --locked -p immich-sync
      - name: Package the Linux formats
        working-directory: crates/app
        env:
          # The AppImage output plugin is executed as an AppImage of its own;
          # this extracts it instead of mounting it, so the runners need no
          # FUSE setup. linuxdeploy itself is passed --appimage-extract-and-run
          # by cargo-packager.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats deb,appimage --out-dir ../../dist
      - name: Attest the Linux packages
        # The repository variable is unset while the repository is private
        # (ticket #16 sets it); an unset variable skips this step and keeps
        # the build green.
        if: ${{ vars.RELEASE_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Name the packages, not dist/*: the packager keeps intermediates in
          # dist/.cargo-packager, which must not become attestation subjects.
          subject-path: |
            dist/*.deb
            dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer (NSIS)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      # See the Linux job: used only by the gated attestation step.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Build the client (release)
        run: cargo build --release --locked -p immich-sync
      - name: Package the Windows installer
        working-directory: crates/app
        run: cargo packager --release --formats nsis --out-dir ../../dist
      - name: Attest the Windows installer
        # See the Linux job.
        if: ${{ vars.RELEASE_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  # Collects both platforms' packages from the real build jobs, hashes what
  # they produced, and publishes. No hash is ever written by hand.
  checksums:
    name: SHA256SUMS and release
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      # Publishing the release needs it; a dispatch without a tag only uploads
      # the workflow artifacts.
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Both platforms and every format R11.1 names must be present before
          # the release is hashed or published.
          test "$(find . -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*-setup.exe' | wc -l)" -eq 1
          # SHA256SUMS is excluded by name on the next line, which is the hazard
          # SC2094 describes.
          # shellcheck disable=SC2094
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish the GitHub release
        if: inputs.tag != '' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release-please creates the release as a draft, so the packages can
          # be attached before anyone sees it. A tag pushed by hand has no
          # release yet and is created published, with the packages in place.
          if draft=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$RELEASE_TAG" dist/* \
              --clobber --repo "$GITHUB_REPOSITORY"
            if [ "$draft" = true ]; then
              gh release edit "$RELEASE_TAG" \
                --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Immich Sync $RELEASE_TAG" --generate-notes
          fi
