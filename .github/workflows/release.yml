name: release

# Releases are built from a version tag. `workflow_dispatch` builds the same
# packages without publishing, which is how an unsigned candidate is checked
# before a tag exists; the tag run is the one that creates the GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Fails a tag that does not name the version in the manifest, before two
  # release builds are paid for. A dispatch has no tag, so the step is skipped
  # while the job still succeeds (a skipped job would skip its dependents too).
  version:
    name: Version matches the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the tag with the package version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('crates/app/Cargo.toml','rb'))['package']['version'])")
          echo "manifest version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

  linux:
    name: Linux packages (deb, AppImage)
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only used by the attestation step below, which stays skipped while
      # the repository variable is unset.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A release profile and this workflow's own key: the ci workflow's
          # dev-profile artifacts are not what this build restores.
          shared-key: release-linux
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          add-rust-environment-hash-key: "false"
          cache-on-failure: "true"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan1 \
            libssl-dev libzstd-dev libdbus-1-dev
          # linuxdeploy calls patchelf. It is not on the runner image and the
          # failure is an unattributed "subprocess failed (exit code 127)".
          sudo apt-get install -y patchelf
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Build the client (release)
        run: cargo build --release --locked -p immich-sync
      - name: Package the Linux formats
        working-directory: crates/app
        env:
          # The AppImage output plugin is executed as an AppImage of its own;
          # this extracts it instead of mounting it, so the runners need no
          # FUSE setup. linuxdeploy itself is passed --appimage-extract-and-run
          # by cargo-packager.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats deb,appimage --out-dir ../../dist
      - name: Attest the Linux packages
        # The repository variable is unset while the repository is private
        # (ticket #16 sets it); an unset variable skips this step and keeps
        # the build green.
        if: ${{ vars.RELEASE_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Name the packages, not dist/*: the packager keeps intermediates in
          # dist/.cargo-packager, which must not become attestation subjects.
          subject-path: |
            dist/*.deb
            dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer (NSIS)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      # See the Linux job: used only by the gated attestation step.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          add-rust-environment-hash-key: "false"
          cache-on-failure: "true"
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Build the client (release)
        run: cargo build --release --locked -p immich-sync
      - name: Package the Windows installer
        working-directory: crates/app
        run: cargo packager --release --formats nsis --out-dir ../../dist
      - name: Attest the Windows installer
        # See the Linux job.
        if: ${{ vars.RELEASE_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  # Collects both platforms' packages from the real build jobs, hashes what
  # they produced, and publishes. No hash is ever written by hand.
  checksums:
    name: SHA256SUMS and release
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      # `gh release create` needs it on a tag run; the dispatch run only
      # uploads the workflow artifacts.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Both platforms and every format R11.1 names must be present before
          # the release is hashed or published.
          test "$(ls ./*.deb 2>/dev/null | wc -l)" -eq 1
          test "$(ls ./*.AppImage 2>/dev/null | wc -l)" -eq 1
          test "$(ls ./*-setup.exe 2>/dev/null | wc -l)" -eq 1
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A re-run of a failed tag build finds the release already there.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Immich Sync $GITHUB_REF_NAME" --generate-notes
          fi
