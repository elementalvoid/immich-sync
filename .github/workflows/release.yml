# yamllint disable rule:line-length
# Pinned action SHAs cannot be wrapped without breaking the reference, and the
# packager and gh invocations read worse split than long.
name: release

# Releases are built from a version tag. A tag pushed by hand triggers this
# workflow; release-please cannot, because a tag pushed with the Actions token
# starts no workflow, so `release-please.yml` calls this as a reusable workflow
# instead. `workflow_dispatch` builds the same packages without publishing,
# which is how an unsigned candidate is checked before a tag exists.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (empty: build only)"
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# No dependency cache here on purpose: a poisoned Actions cache could change
# the published binaries while the provenance attestation still names this
# workflow. Releases are rare; a cold build is the price. The per-push ci
# workflow keeps its caches.

permissions:
  contents: read

jobs:
  # Fails a tag that does not name the version in the manifest, before three
  # release builds are paid for. A dispatch without a tag input skips the step
  # while the job still succeeds (a skipped job would skip its dependents too).
  version:
    name: Version matches the tag
    runs-on: ubuntu-24.04
    env:
      # `github.ref_name` on a tag push, the input when called or dispatched.
      # `github.ref_type` is 'branch' in the other two cases, so the steps
      # below test this instead of it.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Nothing here pushes over git; the token must not land in .git.
          persist-credentials: false
      - name: Compare the tag with the package version
        if: inputs.tag != '' || github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('crates/app/Cargo.toml','rb'))['package']['version'])")
          echo "manifest version: $version, tag: $RELEASE_TAG"
          test "v$version" = "$RELEASE_TAG"

  linux:
    name: Linux packages (deb, AppImage)
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only used by the attestation step below, which stays skipped while
      # the repository variable is unset.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan1 \
            libssl-dev libzstd-dev libdbus-1-dev
          # linuxdeploy calls patchelf. It is not on the runner image and the
          # failure is an unattributed "subprocess failed (exit code 127)".
          sudo apt-get install -y patchelf
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Build the client (release)
        run: cargo build --release --locked -p immich-sync
      - name: Package the Linux formats
        working-directory: crates/app
        env:
          # The AppImage output plugin is executed as an AppImage of its own;
          # this extracts it instead of mounting it, so the runners need no
          # FUSE setup. linuxdeploy itself is passed --appimage-extract-and-run
          # by cargo-packager.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats deb,appimage --out-dir ../../dist
      - name: Attest the Linux packages
        # The repository variable is unset while the repository is private
        # (ticket #16 sets it); an unset variable skips this step and keeps
        # the build green.
        if: ${{ vars.RELEASE_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Name the packages, not dist/*: the packager keeps intermediates in
          # dist/.cargo-packager, which must not become attestation subjects.
          subject-path: |
            dist/*.deb
            dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer (NSIS)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      # See the Linux job: used only by the gated attestation step.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      - name: Build the client (release)
        run: cargo build --release --locked -p immich-sync
      - name: Package the Windows installer
        working-directory: crates/app
        run: cargo packager --release --formats nsis --out-dir ../../dist
      - name: Attest the Windows installer
        # See the Linux job.
        if: ${{ vars.RELEASE_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  # Builds both architectures on the one arm64 runner: x86_64 is
  # cross-compiled, which the macOS SDK and clang support for everything this
  # build compiles (the bundled SQLite included). That avoids paying for an
  # Intel runner, which GitHub retires in Fall 2027. If a cross-compiled
  # dependency ever fails here, the fallback shape is a second job on
  # `macos-26-intel` that builds `x86_64-apple-darwin` natively.
  macos:
    name: macOS DMGs (arm64, x64)
    needs: version
    runs-on: macos-26
    permissions:
      contents: read
      # See the Linux job: used only by the gated attestation step.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          # The Intel DMG is cross-compiled on this arm64 runner.
          rustup target add x86_64-apple-darwin
      # gpui-pre compiles its Metal shaders at build time with `xcrun metal`.
      # Xcode 26 ships the Metal toolchain as a separate downloadable component,
      # so a fresh runner fails with `unable to find utility "metal"`.
      - name: Ensure the Metal toolchain
        run: |
          xcrun metal --version \
            || (xcodebuild -runFirstLaunch && xcodebuild -downloadComponent MetalToolchain)
          xcrun metal --version
      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8
      # cargo-packager resolves `binaries_dir`, `icons`, `licenseFile`, and
      # `infoPlistPath` against the working directory, so it must run from this
      # crate. The packager does not build: it packages the binary already at
      # `target/<triple>/release`. It builds only the `.app`; the DMG is made
      # below with `hdiutil`, because the bundle has to be signed first (#67).
      #
      # The two architectures are built one at a time: two release trees
      # (aws-lc-sys, bundled SQLite, GPUI) do not fit comfortably beside each
      # other on the runner. The arm64 DMG is already in `dist` when its tree
      # and bundle are removed, so the x64 build gets the space.
      # MACOSX_DEPLOYMENT_TARGET comes from `.cargo/config.toml`.
      - name: Read the version for the DMG names
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('crates/app/Cargo.toml','rb'))['package']['version'])")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # Ad-hoc signed: `--sign -` with no identity and `--timestamp=none`, so no
      # Apple account and no notarization (ADR 0008). The bundle signature is
      # what lets arm64 Gatekeeper offer **Open Anyway** instead of reporting
      # the app as damaged (ADR 0008 amendment).
      - name: Build and sign the arm64 bundle, then make the DMG
        working-directory: crates/app
        run: |
          set -euo pipefail
          app="dist/Immich Sync.app"
          dmg="dist/Immich Sync_${VERSION}_aarch64.dmg"
          cargo build --release --locked -p immich-sync --target aarch64-apple-darwin
          cargo packager --release --target aarch64-apple-darwin \
            --formats app --out-dir ../../dist
          codesign --force --sign - --timestamp=none "$app"
          codesign -dv --verbose=4 "$app"
          codesign --verify --strict --verbose=2 "$app"
          staging=$(mktemp -d)
          trap 'hdiutil detach "/Volumes/Immich Sync" || true; rm -rf "$staging"' EXIT
          ditto "$app" "$staging/Immich Sync.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Immich Sync" -srcfolder "$staging" -ov \
            -format UDZO "$dmg"
          # What the user gets: the signed bundle, read back off the image.
          hdiutil attach -readonly -nobrowse "$dmg"
          test -d "/Volumes/Immich Sync/Immich Sync.app"
          codesign --verify --strict --verbose=2 "/Volumes/Immich Sync/Immich Sync.app"
          rm -rf "$app" ../../target/aarch64-apple-darwin
      - name: Build and sign the x64 bundle, then make the DMG
        working-directory: crates/app
        run: |
          set -euo pipefail
          app="dist/Immich Sync.app"
          dmg="dist/Immich Sync_${VERSION}_x64.dmg"
          cargo build --release --locked -p immich-sync --target x86_64-apple-darwin
          cargo packager --release --target x86_64-apple-darwin \
            --formats app --out-dir ../../dist
          codesign --force --sign - --timestamp=none "$app"
          codesign -dv --verbose=4 "$app"
          codesign --verify --strict --verbose=2 "$app"
          staging=$(mktemp -d)
          trap 'hdiutil detach "/Volumes/Immich Sync" || true; rm -rf "$staging"' EXIT
          ditto "$app" "$staging/Immich Sync.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Immich Sync" -srcfolder "$staging" -ov \
            -format UDZO "$dmg"
          hdiutil attach -readonly -nobrowse "$dmg"
          test -d "/Volumes/Immich Sync/Immich Sync.app"
          codesign --verify --strict --verbose=2 "/Volumes/Immich Sync/Immich Sync.app"
          rm -rf "$app"
      # ADR 0008 ships without an Apple identity: no APPLE_* secret and no
      # `signingIdentity`, so there is no notarization ticket to assert and the
      # only signature is the ad-hoc bundle one the steps above verify. The
      # file, its per-architecture name, and its count are the contract, and
      # `checksums` hashes exactly what appears.
      - name: Assert both DMGs are present and named per architecture
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          if [ "$count" -ne 2 ]; then
            echo "expected 2 .dmg files, found $count:" >&2
            find dist -maxdepth 1 -type f -name '*.dmg' -print >&2
            exit 1
          fi
          for arch in aarch64 x64; do
            n=$(find dist -maxdepth 1 -type f -name "*_${arch}.dmg" | wc -l | tr -d ' ')
            if [ "$n" -ne 1 ]; then
              echo "expected one *_${arch}.dmg, found $n" >&2
              exit 1
            fi
          done
          ls -l dist/*.dmg
      - name: Attest the macOS DMGs
        # See the Linux job.
        if: ${{ vars.RELEASE_ATTEST == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmgs
          path: dist/*.dmg
          if-no-files-found: error

  # Collects every platform's packages from the real build jobs, hashes what
  # they produced, and publishes. No hash is ever written by hand.
  checksums:
    name: SHA256SUMS and release
    needs:
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    permissions:
      # Publishing the release needs it; a dispatch without a tag only uploads
      # the workflow artifacts.
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Every platform and format R11.1 names must be present before the
          # release is hashed or published.
          test "$(find . -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*-setup.exe' | wc -l)" -eq 1
          # One DMG per macOS architecture: arm64 and Intel.
          test "$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          # SHA256SUMS is excluded by name on the next line, which is the hazard
          # SC2094 describes.
          # shellcheck disable=SC2094
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish the GitHub release
        if: inputs.tag != '' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release-please creates the release as a draft, so the packages can
          # be attached before anyone sees it. A tag pushed by hand has no
          # release yet and is created published, with the packages in place.
          if draft=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$RELEASE_TAG" dist/* \
              --clobber --repo "$GITHUB_REPOSITORY"
            if [ "$draft" = true ]; then
              gh release edit "$RELEASE_TAG" \
                --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Immich Sync $RELEASE_TAG" --generate-notes
          fi
