name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are not reusable on ephemeral runners and bloat the
  # dependency cache; rust-cache sets this too, but keep it explicit.
  CARGO_INCREMENTAL: 0
  # Keep file/line panic locations while cutting codegen, link time (Windows
  # especially) and cache size. Dependency debug info is already off in
  # Cargo.toml; this trims the workspace crates and test binaries too.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# A newer push to the same ref replaces an in-flight run: before this,
# superseded merges kept burning 10-25 minutes each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit SHA, version tag in the comment. Update deliberately:
      # only releases at least a week old.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux
          # Key on the files that decide the build. The automatic environment
          # hash varies across runner images (Windows attempt to attempt), which
          # made the cache miss; our lockfile/toolchain hash is stable.
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          add-rust-environment-hash-key: "false"
          cache-on-failure: "true"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan1 \
            libssl-dev libzstd-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows
          # The linker is part of cargo's fingerprints but not of this explicit
          # key, so its name is: otherwise a linker change would reuse the old
          # cache and recompile the tree on every run.
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}-lld-link
          add-rust-environment-hash-key: "false"
          cache-on-failure: "true"
      # fmt is platform-independent and already checked on Linux; running it
      # here only paid for a toolchain component and a fresh checkout.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # lld links the 44 test binaries faster than link.exe. rust-lld is a
      # multicall binary and picks the MSVC driver from its own file name, so
      # copy it as lld-link.exe instead of teaching rustc the flavor.
      - name: Use lld-link for linking
        shell: pwsh
        run: |
          $rustLld = Join-Path (rustc --print sysroot) 'lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe'
          if (-not (Test-Path $rustLld)) { throw "rust-lld not found at $rustLld" }
          $linker = Join-Path $env:RUNNER_TEMP 'lld-link.exe'
          Copy-Item $rustLld $linker
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo test --locked --workspace

  linux-gui-smoke:
    name: Linux GUI smoke (Xvfb + lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Shared with the Linux job: rust-cache persists dependencies only, so
          # this job restores the same dependency artifacts instead of
          # compiling them a third time. It never saves: the Linux job owns the
          # key and its cache covers the test targets too, while a bin-only save
          # here finished first and starved the Linux job of dev-dependencies.
          shared-key: linux
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          add-rust-environment-hash-key: "false"
          save-if: "false"
          cache-on-failure: "true"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan1 mesa-vulkan-drivers libdbus-1-dev \
            xvfb xauth dbus-daemon imagemagick x11-utils
      - run: cargo build --locked --bin immich-sync
      - name: Capture a real frame
        run: |
          set -euo pipefail
          # The ICD file name depends on the mesa version (lvp_icd.json vs lvp_icd.x86_64.json).
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1) || ICD=""
          if [ -z "$ICD" ]; then
            echo "no lavapipe ICD file under /usr/share/vulkan/icd.d" >&2
            exit 1
          fi
          echo "lavapipe ICD=$ICD"
          export VK_ICD_FILENAMES="$ICD"
          export VK_DRIVER_FILES="$ICD"
          export LIBGL_ALWAYS_SOFTWARE=1
          unset WAYLAND_DISPLAY
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            set -euo pipefail
            # Give this run its own log and state directory: a log left by an
            # earlier run would satisfy the started poll below before this app
            # ever starts, and a stale state database would hand off instead.
            export XDG_DATA_HOME="$PWD/xdg-data"
            target/debug/immich-sync >shot.png.log 2>&1 &
            APP=$!
            # The app logs here, not to stdout.
            LOG_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/immich-sync"
            started() { grep -qs "immich-sync started" "$LOG_DIR"/immich-sync.log* 2>/dev/null; }
            alive() { kill -0 $APP 2>/dev/null; }
            # Wait for the client instead of sleeping a fixed 10 s: opening the
            # store made startup slower, and a fixed budget captured a black
            # root while the app was still booting.
            START_TIMEOUT=60
            waited=$SECONDS
            until started; do
              alive || { echo "the app exited during startup:" >&2; cat shot.png.log >&2; exit 1; }
              if [ $((SECONDS - waited)) -ge $START_TIMEOUT ]; then
                echo "timeout: no immich-sync started line in $LOG_DIR after ${START_TIMEOUT}s" >&2
                cat shot.png.log >&2
                kill $APP 2>/dev/null || true
                exit 1
              fi
              sleep 1
            done
            echo "app started after $((SECONDS - waited))s"
            kill -0 $APP                  # the app survived startup
            # That line is logged before the window opens, so wait for a drawn
            # frame too: a bare root captures as one flat colour.
            PAINT_TIMEOUT=60
            waited=$SECONDS
            while :; do
              alive || { echo "the app exited before it painted:" >&2; cat shot.png.log >&2; exit 1; }
              # Bound the capture: a wedged import must not block the loop past
              # the deadline below.
              timeout 30 import -window root shot.png
              colors=$(identify -format %k shot.png)
              if [ "$colors" -gt 1 ]; then break; fi
              if [ $((SECONDS - waited)) -ge $PAINT_TIMEOUT ]; then
                echo "timeout: the frame is still one flat colour after ${PAINT_TIMEOUT}s (colors=$colors)" >&2
                cat shot.png.log >&2
                kill $APP 2>/dev/null || true
                exit 1
              fi
              sleep 1
            done
            echo "frame painted after $((SECONDS - waited))s"
            target/debug/immich-sync      # second launch: non-primary, exits 0 under set -e
            sleep 2
            kill -0 $APP                  # the handoff did not stop the primary
            kill $APP 2>/dev/null || true
            wait $APP 2>/dev/null || true
            cat shot.png.log
            echo "--- app log directory: $LOG_DIR"
            ls -la "$LOG_DIR" 2>/dev/null || true
            newest=$(ls -t "$LOG_DIR"/immich-sync.log* 2>/dev/null | head -1 || true)
            if [ -n "$newest" ]; then
              echo "--- app log: $newest"
              cat "$newest"
            else
              echo "--- no app log file found"
            fi
          '
      - name: Assert the frame is not blank
        run: |
          set -euo pipefail
          identify -format "geom=%wx%h colors=%k\n" shot.png
          colors=$(identify -format %k shot.png)
          mean=$(convert shot.png -colorspace gray -format '%[fx:mean]' info:)
          echo "screenshot gray mean=$mean"
          # The colour test is what rejects a flat frame whatever its
          # brightness: a uniform grey frame is colors=1 with mean~0.5, so the
          # mean test alone would pass it. Together they reject a bare root.
          test "$colors" -gt 1
          test "$mean" != "0"
