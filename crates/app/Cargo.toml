[package]
name = "immich-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
directories = "6"
gpui-kit.workspace = true
gpui-tray.workspace = true
interprocess.workspace = true
keyring-core = "=1.0.1"
serde = { version = "1", features = ["derive"] }
sync-core = { path = "../sync-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
mock-immich = { path = "../mock-immich" }
# The same bundled SQLite sync-core uses, so a test can break one query on
# purpose and read the surface the diagnostics view reports.
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Packaging (SPEC R11.1). Run the packager from this directory:
#   cargo packager --release --formats deb,appimage --out-dir ../../dist
# Every path in this table is resolved against the working directory, so the
# release workflow changes into this crate first. The version is not set here:
# it comes from this manifest, and the workflow fails when the git tag and the
# manifest version disagree.
[package.metadata.packager]
identifier = "com.elementalvoid.immich-sync"
productName = "Immich Sync"
description = "Uploads photos and videos from local folders to one Immich server."
# The deb Description body. Windows formats can read the whole README; this is
# what `apt show` and `dpkg -s` print, so it stays short.
longDescription = """\
Keeps the server in step as files change, with deletion review, bandwidth
limits, and a tray that shows progress and the last error.
"""
category = "Photography"
publisher = "elementalvoid"
authors = ["Matt Klich <elementalvoid@users.noreply.github.com>"]
homepage = "https://github.com/elementalvoid/immich-sync"
icons = ["icons/icon.png", "icons/icon.ico"]
licenseFile = "../../LICENSE-MIT"

# The installer icon, and the install-mode page. `both` lets the user choose
# All users (the default: `$PROGRAMFILES64\Immich Sync`, HKLM metadata, All
# Users shortcuts) or Current user only (`%LOCALAPPDATA%\Programs\Immich Sync`,
# HKCU metadata, current-user shortcuts). `both` requests the highest execution
# level, so the installer prompts for elevation whichever mode is chosen, and a
# reinstall preselects the mode the previous install recorded. The installed
# executable carries the same icon as resource 1; see `build.rs`.
[package.metadata.packager.nsis]
installerIcon = "icons/icon.ico"
installMode = "both"

# Runtime libraries for the deb, read off the release binary (readelf NEEDED
# plus the dlopen names): the linked ones, the Vulkan loader, the Wayland
# client, and the EGL/Wayland-EGL surfaces the GPU stack opens (a missing
# libwayland-egl.so.1 panics wayland-sys). A desktop distro already has them,
# but dpkg must know.
[package.metadata.packager.deb]
depends = [
    "libc6",
    "libgcc-s1",
    "libdbus-1-3",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libvulkan1",
    "libwayland-client0",
    "libwayland-egl1",
    "libegl1",
]
# `licenseFile` only reaches NSIS/WiX/DMG, so the deb ships both licence texts
# itself. Sources are relative to the working directory, which the release
# workflow sets to this crate. See `Config::resources` in cargo-packager.
[package.metadata.packager.deb.files]
"../../LICENSE-MIT" = "usr/share/doc/immich-sync/LICENSE-MIT"
"../../LICENSE-APACHE" = "usr/share/doc/immich-sync/LICENSE-APACHE"

# The AppImage has no licence page either; ship the same texts in the AppDir.
[package.metadata.packager.appimage.files]
"../../LICENSE-MIT" = "usr/share/doc/immich-sync/LICENSE-MIT"
"../../LICENSE-APACHE" = "usr/share/doc/immich-sync/LICENSE-APACHE"

# The Windows resource script `icon.rc` is compiled with this, so the installed
# executable carries the app icon. It is deliberately not under
# `[target.'cfg(windows)'.build-dependencies]`: a build script is compiled for
# the host, and cargo resolves that table against the host too, so the crate
# would be missing when a Linux host cross-compiles to Windows. `build.rs`
# gates on `CARGO_CFG_TARGET_OS` instead and stays inert on other targets.
[build-dependencies]
embed-resource = "3"

[target."cfg(target_os = \"linux\")".dependencies]
# The Secret Service store, pinned: the keyring ecosystem restructured in 2026
# (ADR 0006 research §3.2). `crypto-rust` keeps the D-Bus transport encryption
# in Rust, so the build needs no OpenSSL.
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "=1.1.0"
windows-registry = "0.6"
