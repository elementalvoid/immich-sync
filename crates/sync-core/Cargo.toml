[package]
name = "sync-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
immich-client = { path = "../immich-client" }
# Bundled SQLite: no system library, no version drift across platforms (ADR 0005).
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
# Shared with mock-immich, so the workspace compiles one SHA-1 implementation.
sha1 = "0.10"
thiserror = "2"
# spawn_blocking for the hashing pass; the HTTP client brings the runtime itself.
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
mock-immich = { path = "../mock-immich" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"
